name: Python compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy-version: "1.26.*"
          - python-version: "3.10"
            numpy-version: "2.*"
          - python-version: "3.11"
            numpy-version: "2.*"
          - python-version: "3.12"
            numpy-version: "2.*"
          - python-version: "3.13"
            numpy-version: "2.*"
          - python-version: "3.14"
            numpy-version: "2.*"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install fastText
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ matrix.numpy-version }}"
          python -m pip install --no-deps .
      - name: Run Python API regression tests
        run: python -m unittest tests/test_numpy_compatibility.py
