[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*", "cp3??t-*"]
test-requires = ["numpy"]
test-command = "python -c \"import fasttext; assert fasttext.tokenize('hello world') == ['hello', 'world']\""
build-verbosity = 1

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
