name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Match tag to package version
        run: |
          package_version="$(python setup.py --version)"
          cmake_version="$(sed -nE 's/project\(fasttext VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          test "${package_version}" = "${cmake_version}"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  build:
    needs: validate-tag
    uses: ./.github/workflows/wheels.yml

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fasttext-modern/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
